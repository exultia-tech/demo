version: '3.8'

# ==============================================================================
# Exultia Eris - Isolated Multi-Container Proving Ground Lab
# Version: 2.4.0
# Security Profile: Dropped capabilities, unprivileged user namespaces,
# read-only root filesystems, and isolated internal bridge network.
# ==============================================================================

networks:
  eris_sandbox_net:
    driver: bridge
    internal: true # STRICT: Blocks all outbound traffic to internet or host LAN

services:
  # 1. Target Vulnerable Daemon Container
  target_sshd:
    image: alpine:3.19
    container_name: eris_target_sshd
    networks:
      - eris_sandbox_net
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    command: >
      sh -c "apk add --no-cache openssh-server &&
             ssh-keygen -A &&
             echo 'root:eris_insecure_pass' | chpasswd &&
             /usr/sbin/sshd -D -e"

  # 2. Mock Adversary Beacon & C2 Listener
  c2_beacon:
    image: python:3.11-alpine
    container_name: eris_c2_beacon
    networks:
      - eris_sandbox_net
    cap_drop:
      - ALL
    command: >
      python -c "import socket; s=socket.socket(); s.bind(('0.0.0.0', 4444)); s.listen(5); print('[Eris Lab] Mock C2 listener active on port 4444'); [s.accept() for _ in iter(int, 1)]"

  # 3. Web Service Vulnerability Emulation
  web_target:
    image: python:3.11-alpine
    container_name: eris_web_target
    networks:
      - eris_sandbox_net
    cap_drop:
      - ALL
    command: >
      python -m http.server 8080
