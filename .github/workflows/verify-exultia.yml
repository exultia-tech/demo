name: Independent Exultia Verification Suite

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      compromise_count:
        description: "Random live feed items to sample and test in Gate 9"
        required: false
        default: "250"
      compromise_seed:
        description: "Optional PRNG seed for reproducible Gate 9 sampling"
        required: false
        default: ""
  schedule:
    # Weekly automated proof run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: exultia-demo-verify
  cancel-in-progress: false

jobs:
  blackbox-verify:
    name: Independent 9-Gate Verification (Ubuntu 24.04)
    runs-on: ${{ fromJSON(github.repository == 'exultia-tech/demo' && '["self-hosted", "linux", "x64", "exultia-demo"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    env:
      COMPROMISE_SAMPLE_COUNT: ${{ github.event.inputs.compromise_count || '250' }}
      COMPROMISE_SEED: ${{ github.event.inputs.compromise_seed || '' }}
      EXULTIA_OPERATOR_KEY: ${{ secrets.EXULTIA_OPERATOR_KEY }}
      EVIDENCE_DIR: ${{ github.workspace }}/evidence

    steps:
      - name: Checkout clean verification harness
        uses: actions/checkout@v7

      - name: Install independent OS audit tools (python3-cryptography, openssh-server, nftables, jq)
        run: |
          rm -rf "$EVIDENCE_DIR" && mkdir -p "$EVIDENCE_DIR"
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography openssh-server nftables jq

      - name: "Gate 1: Independent Ed25519 provenance, tamper test & abstention JSON"
        id: gate1
        run: bash scripts/verify-exultia.sh --gate 1

      - name: "Gate 2: Fail-closed binary install (SHA-256 + SLSA L2 DSSE) & permissions"
        id: gate2
        run: bash scripts/verify-exultia.sh --gate 2

      - name: "Gate 3: Live Vantage random advisory remediation & bitwise rollback"
        id: gate3
        run: bash scripts/verify-exultia.sh --gate 3

      - name: "Gate 4: Live Vantage kernel netfilter guard & non-breakage (CVE-2026-98432)"
        id: gate4
        run: bash scripts/verify-exultia.sh --gate 4

      - name: "Gate 5: Real native apt security upgrade via --vendor (BEFORE < AFTER)"
        id: gate5
        run: bash scripts/verify-exultia.sh --gate 5

      - name: "Gate 6: Negative fail-closed abstention check (CVE-2026-136158 Valkey JSON)"
        id: gate6
        run: bash scripts/verify-exultia.sh --gate 6

      - name: "Gate 7: SOX/PCI configuration drift injection, detection & auto-repair"
        id: gate7
        run: bash scripts/verify-exultia.sh --gate 7

      - name: "Gate 8: Daemon sync --dry-run, behavioral gates & signed attestation"
        id: gate8
        run: bash scripts/verify-exultia.sh --gate 8

      - name: "Gate 9: 250 host-relevant confirmed fixes (zero N/A padding)"
        id: gate9
        run: bash scripts/verify-exultia.sh --gate 9

      - name: Write verification summary
        if: always()
        run: |
          python3 scripts/generate-plain-english-summary.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --out "$EVIDENCE_DIR/VERIFICATION_SUMMARY.md" \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --runner-name "${{ runner.name }}" \
            --runner-os "${{ runner.os }}" \
            --runner-arch "${{ runner.arch }}" \
            --run-id "${{ github.run_id }}" \
            --gate-outcomes "1=${{ steps.gate1.outcome }},2=${{ steps.gate2.outcome }},3=${{ steps.gate3.outcome }},4=${{ steps.gate4.outcome }},5=${{ steps.gate5.outcome }},6=${{ steps.gate6.outcome }},7=${{ steps.gate7.outcome }},8=${{ steps.gate8.outcome }},9=${{ steps.gate9.outcome }}" \
            --print

      - name: Upload immutable verification evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exultia-verification-evidence
          path: evidence/
          retention-days: 30

  multi-distro-verify:
    name: Multi-Distro 9-Gate Verification (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: debian-12
            label: Debian 12 (bookworm)
            image: debian:bookworm
            setup_cmd: >-
              export DEBIAN_FRONTEND=noninteractive &&
              apt-get update -qq &&
              apt-get install -y -qq --no-install-recommends
              curl ca-certificates bash python3 python3-cryptography
              openssh-server nftables jq procps iproute2 sudo util-linux &&
              ssh-keygen -A >/dev/null 2>&1 || true
          - slug: rocky-9
            label: Rocky Linux 9 (EL9)
            image: rockylinux:9.3
            setup_cmd: >-
              dnf install -y -q --setopt=install_weak_deps=False
              openssh-server openssh-clients nftables python3
              python3-cryptography jq procps-ng iproute sudo &&
              ssh-keygen -A >/dev/null 2>&1 || true
          - slug: alpine-3.21
            label: Alpine Linux 3.21 (musl)
            image: alpine:3.21.0
            setup_cmd: >-
              apk update -q &&
              apk add --no-cache -q bash curl ca-certificates openssh
              nftables python3 py3-cryptography jq iproute2 procps sudo
              coreutils util-linux shadow &&
              ssh-keygen -A >/dev/null 2>&1 || true

    steps:
      - name: Checkout clean verification harness
        uses: actions/checkout@v7

      - name: Run 9-gate black-box verification in ${{ matrix.image }} container
        id: distro_run
        env:
          COMPROMISE_SAMPLE_COUNT: ${{ github.event.inputs.compromise_count || '250' }}
          COMPROMISE_SEED: ${{ github.event.inputs.compromise_seed || '' }}
          EXULTIA_OPERATOR_KEY: ${{ secrets.EXULTIA_OPERATOR_KEY }}
          DISTRO_SLUG: ${{ matrix.slug }}
          DISTRO_LABEL: ${{ matrix.label }}
          DISTRO_IMAGE: ${{ matrix.image }}
          DISTRO_SETUP_CMD: ${{ matrix.setup_cmd }}
        run: |
          rm -rf "evidence-${DISTRO_SLUG}" && mkdir -p "evidence-${DISTRO_SLUG}"
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e COMPROMISE_SAMPLE_COUNT \
            -e COMPROMISE_SEED \
            -e EXULTIA_OPERATOR_KEY \
            -e DISTRO_SLUG \
            -e DISTRO_LABEL \
            -e DISTRO_SETUP_CMD \
            -e EVIDENCE_DIR="/workspace/evidence-${DISTRO_SLUG}" \
            -e RUNNER_NAME="${RUNNER_NAME:-GitHub Actions}" \
            -e RUNNER_OS="${RUNNER_OS:-Linux}" \
            -e RUNNER_ARCH="${RUNNER_ARCH:-X64}" \
            -e GITHUB_RUN_ID="${GITHUB_RUN_ID:-}" \
            "${DISTRO_IMAGE}" sh -c '
              set -eu
              sh -c "${DISTRO_SETUP_CMD}"
              cd /workspace
              bash -lc '\''
                set +e
                overall_rc=0
                outcomes=""
                for g in 1 2 3 4 5 6 7 8 9; do
                  bash scripts/verify-exultia.sh --gate "$g"
                  rc=$?
                  if [ "$rc" -eq 0 ]; then
                    res="success"
                  else
                    res="failure"
                    overall_rc=1
                  fi
                  outcomes="${outcomes:+${outcomes},}${g}=${res}"
                done
                python3 scripts/generate-plain-english-summary.py \
                  --evidence-dir "$EVIDENCE_DIR" \
                  --out "$EVIDENCE_DIR/VERIFICATION_SUMMARY.md" \
                  --distro-label "$DISTRO_LABEL" \
                  --runner-name "$RUNNER_NAME" \
                  --runner-os "$RUNNER_OS" \
                  --runner-arch "$RUNNER_ARCH" \
                  --run-id "$GITHUB_RUN_ID" \
                  --gate-outcomes "$outcomes" \
                  --print
                exit "$overall_rc"
              '\''
            '

      - name: Append verification summary to job summary
        if: always()
        run: |
          if [ -f "evidence-${{ matrix.slug }}/VERIFICATION_SUMMARY.md" ]; then
            cat "evidence-${{ matrix.slug }}/VERIFICATION_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable verification evidence bundle (${{ matrix.slug }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exultia-verification-evidence-${{ matrix.slug }}
          path: evidence-${{ matrix.slug }}/
          retention-days: 30
