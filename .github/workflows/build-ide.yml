name: SecureIDE Multi-OS Hardened Build Pipeline

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Subscription Tier (COMMUNITY, TEAM, ENTERPRISE)'
        required: true
        default: 'TEAM'
        type: choice
        options:
          - COMMUNITY
          - TEAM
          - ENTERPRISE
      target_os:
        description: 'Target Operating System'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
      engine:
        description: 'Target IDE Engine'
        required: true
        default: 'vscode'
        type: choice
        options:
          - vscode
          - theia
          - zed
          - neovim
          - jupyterlab
      brand_name:
        description: 'White-Label Product Name'
        required: false
        default: 'SecureIDE Studio'
        type: string
      registry_url:
        description: 'Custom Proxy Extension Gallery URL'
        required: false
        default: ''
        type: string
      extensions:
        description: 'Whitelisted Extensions (Comma-separated ID list or URLs)'
        required: false
        default: ''
        type: string
      telemetry_url:
        description: 'Enterprise SIEM / Telemetry URL (Ultimate Only)'
        required: false
        default: ''
        type: string
      locale:
        description: 'Default UI Language Locale (en, es, ja, zh-cn, de, fr, ko, pt-br, it, tr, pl, ru)'
        required: false
        default: 'en'
        type: string
      version:
        description: 'Engine Version / Channel (latest, preview, previous, or custom tag)'
        required: false
        default: 'latest'
        type: string
      build_id:
        description: 'Unique Build ID for Tracking'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Assemble Hardened IDE (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: [self-hosted, Windows, X64, baremetal]
            artifact_ext: zip
            enable: ${{ inputs.target_os == 'windows' || inputs.target_os == 'all' }}
          - os: linux
            runner: ubuntu-latest
            artifact_ext: tar.gz
            enable: ${{ inputs.target_os == 'linux' || inputs.target_os == 'all' }}
          - os: macos
            runner: macos-latest
            artifact_ext: dmg
            enable: ${{ inputs.target_os == 'macos' || inputs.target_os == 'all' }}

    steps:
      - name: Check Matrix Condition
        if: ${{ !matrix.enable }}
        run: echo "Skipping ${{ matrix.os }} build as requested."

      - name: Checkout SecureIDE Repository
        if: ${{ matrix.enable }}
        uses: actions/checkout@v7

      - name: Setup Node.js (for SBOM Generation & ASAR Packing)
        if: ${{ matrix.enable }}
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Inno Setup Compiler (Windows Setup Wizard)
        if: ${{ matrix.enable && matrix.os == 'windows' }}
        shell: pwsh
        run: |
          if (Get-Command iscc.exe -ErrorAction SilentlyContinue) {
            Write-Host ">>> Inno Setup Compiler already available in PATH."
          } elseif (Test-Path "C:\inno\ISCC.exe") {
            echo "C:\inno" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host ">>> Added C:\inno to GITHUB_PATH."
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host ">>> Added Inno Setup 6 to GITHUB_PATH."
          } elseif (Get-Command choco -ErrorAction SilentlyContinue) {
            choco install innosetup -y --no-progress
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host ">>> Notice: Inno Setup compiler not found; portable ZIP will be packaged without setup installer."
          }

      - name: Execute Deterministic Hardening & Binary Assembly
        if: ${{ matrix.enable }}
        shell: pwsh
        env:
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_OS: ${{ matrix.os }}
          INPUT_ENGINE: ${{ inputs.engine }}
          INPUT_BRAND: ${{ inputs.brand_name }}
          INPUT_LOCALE: ${{ inputs.locale }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REGISTRY: ${{ inputs.registry_url }}
          INPUT_EXTENSIONS: ${{ inputs.extensions }}
          INPUT_TELEMETRY: ${{ inputs.telemetry_url }}
          INPUT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          ./scripts/assemble-ide.ps1 `
            -Tier "$env:INPUT_TIER" `
            -TargetOS "$env:INPUT_OS" `
            -Engine "$env:INPUT_ENGINE" `
            -BrandName "$env:INPUT_BRAND" `
            -Locale "$env:INPUT_LOCALE" `
            -Version "$env:INPUT_VERSION" `
            -RegistryUrl "$env:INPUT_REGISTRY" `
            -Extensions "$env:INPUT_EXTENSIONS" `
            -TelemetryUrl "$env:INPUT_TELEMETRY" `
            -BuildId "$env:INPUT_BUILD_ID" `
            -OutputDir "./dist"

      - name: Generate Cryptographic CycloneDX 1.5 SBOM
        if: ${{ matrix.enable }}
        shell: pwsh
        env:
          INPUT_BRAND: ${{ inputs.brand_name }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_ENGINE: ${{ inputs.engine }}
          INPUT_OS: ${{ matrix.os }}
        run: |
          node ./scripts/generate-sbom.js `
            --dist "./dist" `
            --brand "$env:INPUT_BRAND" `
            --tier "$env:INPUT_TIER" `
            --engine "$env:INPUT_ENGINE" `
            --os "$env:INPUT_OS" `
            --output "./dist/cyclonedx-sbom.json"

      - name: Compute SHA-256 Checksums
        if: ${{ matrix.enable }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "./dist" -File | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            Write-Host ">>> [CHECKSUM] $($_.Name) : $($hash.Hash)"
            "$($hash.Hash)  $($_.Name)" | Out-File -Append -FilePath "./dist/SHA256SUMS.txt" -Encoding utf8
          }

      - name: Deploy Artifacts to Baremetal Release CDN (D:\releases on RAID 1)
        if: ${{ matrix.enable && matrix.os == 'windows' }}
        shell: pwsh
        run: |
          $targetReleaseDir = if (Test-Path "D:\releases") { "D:\releases" } elseif (Test-Path "C:\releases") { "C:\releases" } else { $null }
          if ($targetReleaseDir) {
            Write-Host ">>> [RELEASE STORAGE] Deploying compiled binaries to $targetReleaseDir on RAID 1 (exultia_prod) for $0-egress distribution..."
            Get-ChildItem -Path "./dist" -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$targetReleaseDir\$($_.Name)" -Force
              Write-Host ">>> [DEPLOYED] $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB) -> $targetReleaseDir\$($_.Name)"
            }
            Write-Host ">>> [RELEASE STORAGE] Deployment complete! Accessible at https://download.exultia.tech"
          } else {
            Write-Host ">>> [RELEASE STORAGE] Notice: Release directory not found on this runner, skipping local storage copy."
          }

      - name: Upload Release Artifacts
        if: ${{ matrix.enable }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.brand_name }}-${{ matrix.os }}-${{ inputs.tier }}-${{ inputs.build_id }}
          path: ./dist/*
          retention-days: 7

      - name: Cache Artifact to Vercel Blob (Optional Secondary CDN Fallback)
        if: ${{ matrix.enable }}
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm install @vercel/blob
          node -e "
          (async () => {
            const token = process.env.BLOB_READ_WRITE_TOKEN;
            if (!token) {
              console.log('Notice: BLOB_READ_WRITE_TOKEN not set in GitHub secrets, skipping Vercel Blob upload.');
              process.exit(0);
            }
            const { put } = require('@vercel/blob');
            const fs = require('fs');
            const path = require('path');
            const files = fs.readdirSync('./dist').filter(f => f.endsWith('.zip') || f.endsWith('.exe') || f.endsWith('.dmg') || f.endsWith('.tar.gz'));
            console.log('Found dist files to upload:', files);
            for (const f of files) {
              const fullPath = path.join('./dist', f);
              const stat = fs.statSync(fullPath);
              console.log('Uploading ' + f + ' (' + stat.size + ' bytes) to Vercel Blob...');
              try {
                const res = await put(f, fs.readFileSync(fullPath), { access: 'public', token });
                console.log('Successfully uploaded to Vercel Blob:', res.url);
              } catch (blobErr) {
                console.warn('Vercel Blob upload skipped for ' + f + ' (store may be suspended or rate-limited):', blobErr.message);
              }
            }
            console.log('Vercel Blob cache step complete.');
          })().catch(err => {
            console.warn('Notice: Vercel Blob step encountered an error but will not block pipeline (primary CDN is baremetal download.exultia.tech):', err.message);
            process.exit(0);
          });
          "
