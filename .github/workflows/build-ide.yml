name: SecureIDE Multi-OS Hardened Build Pipeline

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Subscription Tier (COMMUNITY, TEAM, ENTERPRISE)'
        required: true
        default: 'TEAM'
        type: choice
        options:
          - COMMUNITY
          - TEAM
          - ENTERPRISE
      target_os:
        description: 'Target Operating System'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
      engine:
        description: 'Target IDE Engine'
        required: true
        default: 'vscode'
        type: choice
        options:
          - vscode
          - theia
          - zed
          - neovim
          - jupyterlab
      brand_name:
        description: 'White-Label Product Name'
        required: false
        default: 'SecureIDE Studio'
        type: string
      registry_url:
        description: 'Custom Proxy Extension Gallery URL'
        required: false
        default: ''
        type: string
      extensions:
        description: 'Whitelisted Extensions (Comma-separated ID list or URLs)'
        required: false
        default: ''
        type: string
      telemetry_url:
        description: 'Enterprise SIEM / Telemetry URL (Ultimate Only)'
        required: false
        default: ''
        type: string
      locale:
        description: 'Default UI Language Locale (en, es, ja, zh-cn, de, fr, ko, pt-br, it, tr, pl, ru)'
        required: false
        default: 'en'
        type: string
      version:
        description: 'Engine Version / Channel (latest, preview, previous, or custom tag)'
        required: false
        default: 'latest'
        type: string
      build_id:
        description: 'Unique Build ID for Tracking'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Assemble Hardened IDE (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            artifact_ext: zip
            enable: ${{ inputs.target_os == 'windows' || inputs.target_os == 'all' }}
          - os: linux
            runner: ubuntu-latest
            artifact_ext: tar.gz
            enable: ${{ inputs.target_os == 'linux' || inputs.target_os == 'all' }}
          - os: macos
            runner: macos-latest
            artifact_ext: dmg
            enable: ${{ inputs.target_os == 'macos' || inputs.target_os == 'all' }}

    steps:
      - name: Check Matrix Condition
        if: ${{ !matrix.enable }}
        run: echo "Skipping ${{ matrix.os }} build as requested."

      - name: Checkout SecureIDE Repository
        if: ${{ matrix.enable }}
        uses: actions/checkout@v7

      - name: Setup Node.js (for SBOM Generation & ASAR Packing)
        if: ${{ matrix.enable }}
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Inno Setup Compiler (Windows Setup Wizard)
        if: ${{ matrix.enable && matrix.os == 'windows' }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Execute Deterministic Hardening & Binary Assembly
        if: ${{ matrix.enable }}
        shell: pwsh
        run: |
          ./scripts/assemble-ide.ps1 `
            -Tier "${{ inputs.tier }}" `
            -TargetOS "${{ matrix.os }}" `
            -Engine "${{ inputs.engine }}" `
            -BrandName "${{ inputs.brand_name }}" `
            -Locale "${{ inputs.locale }}" `
            -Version "${{ inputs.version }}" `
            -RegistryUrl "${{ inputs.registry_url }}" `
            -Extensions "${{ inputs.extensions }}" `
            -TelemetryUrl "${{ inputs.telemetry_url }}" `
            -BuildId "${{ inputs.build_id }}" `
            -OutputDir "./dist"

      - name: Generate Cryptographic CycloneDX 1.5 SBOM
        if: ${{ matrix.enable }}
        shell: pwsh
        run: |
          node ./scripts/generate-sbom.js `
            --dist "./dist" `
            --brand "${{ inputs.brand_name }}" `
            --tier "${{ inputs.tier }}" `
            --engine "${{ inputs.engine }}" `
            --os "${{ matrix.os }}" `
            --output "./dist/cyclonedx-sbom.json"

      - name: Compute SHA-256 Checksums
        if: ${{ matrix.enable }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "./dist" -File | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            Write-Host ">>> [CHECKSUM] $($_.Name) : $($hash.Hash)"
            "$($hash.Hash)  $($_.Name)" | Out-File -Append -FilePath "./dist/SHA256SUMS.txt" -Encoding utf8
          }

      - name: Upload Release Artifacts
        if: ${{ matrix.enable }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.brand_name }}-${{ matrix.os }}-${{ inputs.tier }}-${{ inputs.build_id }}
          path: ./dist/*
          retention-days: 7

      - name: Cache Artifact to Vercel Blob (Exultia CDN)
        if: ${{ matrix.enable && env.BLOB_READ_WRITE_TOKEN != '' }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm install @vercel/blob
          node -e "
          const { put } = require('@vercel/blob');
          const fs = require('fs');
          const path = require('path');
          const files = fs.readdirSync('./dist').filter(f => f.endsWith('.zip') || f.endsWith('.exe') || f.endsWith('.dmg') || f.endsWith('.tar.gz'));
          for (const f of files) {
            console.log('Uploading ' + f + ' to Vercel Blob...');
            put(f, fs.readFileSync(path.join('./dist', f)), { access: 'public', token: process.env.BLOB_READ_WRITE_TOKEN })
              .then(b => console.log('Successfully uploaded:', b.url))
              .catch(e => { console.error('Upload failed:', e); process.exit(1); });
          }
          "
