name: "[Exultia Report Email] 29/29 OS VMs PASSED — Full Insanity Mode Report (wstrika2@gmail.com)"
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exultia-insanity-email.yml'

permissions:
  issues: write
  contents: write

jobs:
  dispatch-report-email:
    runs-on: ubuntu-latest
    steps:
      - name: Post Full Insanity Mode Report via github-actions[bot] to email wstrika2@gmail.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_B64: ""
        run: |
          echo "$REPORT_B64" | base64 -d > /tmp/report_body.md
          gh issue comment 2 --repo wstrika/exultia --body-file /tmp/report_body.md
          cat /tmp/report_body.md >> "$GITHUB_STEP_SUMMARY"
