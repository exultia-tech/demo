name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python Runtime (Floating Security Patches)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true

      - name: Audit Python Runtime & EOL Lifecycle Gate
        run: python scripts/verify-python-runtime.py

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Test Suite
        run: npm run test

      - name: Verify Build
        run: npm run build
